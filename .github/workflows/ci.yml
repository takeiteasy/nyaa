name: ci

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lisp: [sbcl, ecl, ccl]
    steps:
      - uses: actions/checkout@v5

      - name: Install Lisp
        # SBCL is always installed: it bootstraps Quicklisp below regardless
        # of which implementation the tests run under. CCL has no apt
        # package -- it is installed from its upstream release below.
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl ${{ matrix.lisp != 'ccl' && matrix.lisp || '' }}

      - name: Install CCL
        if: matrix.lisp == 'ccl'
        run: |
          curl -sSfL https://github.com/Clozure/ccl/releases/download/v1.13/ccl-1.13-linuxx86.tar.gz \
              | sudo tar xz -C /opt
          printf '#!/bin/sh\nexec /opt/ccl/lx86cl64 "$@"\n' | sudo tee /usr/local/bin/ccl >/dev/null
          sudo chmod +x /usr/local/bin/ccl

      - name: Install Quicklisp
        run: |
          curl -sSfLO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --no-userinit --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'
          cp -R "$GITHUB_WORKSPACE" ~/quicklisp/local-projects/nyaa

      - name: Install dependencies outside Quicklisp
        run: |
          git clone --depth 1 https://github.com/takeiteasy/meow \
              ~/quicklisp/local-projects/meow
          git clone --depth 1 https://github.com/takeiteasy/trivial-high-precision-timer \
              ~/quicklisp/local-projects/trivial-high-precision-timer

      - name: Test
        run: tests/test.sh ${{ matrix.lisp }}
