name: ci

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          rebar3-version: '3.27'

      # The rebar.config dep on patchbay is an SSH URL (private repo),
      # so the runner needs a read-only deploy key registered on
      # takeiteasy/patchbay. The private half lives in this repo's
      # DEPLOY_KEY secret.
      - name: Install deploy key for private patchbay dependency
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      # Plain compile first: a cold `rebar3 as test ltest` fails while
      # compiling ltest's own LFE sources before the lfe dep is built
      # (documented in docs/getting-started.md).
      - name: Compile
        run: rebar3 compile

      - name: Test
        run: rebar3 as test ltest
